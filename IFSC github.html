<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-INTEL | SECURE DATA</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --card-bg: rgba(255, 255, 255, 0.06);
            --glow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        body {
            background: var(--bg);
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container { width: 100%; max-width: 800px; }

        /* 1. Disclaimer at Top */
        .disclaimer {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 0, 0, 0.08);
            border: 1px solid rgba(255, 79, 79, 0.3);
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .disclaimer h4 { color: #ff4f4f; margin: 0 0 10px 0; font-size: 16px; letter-spacing: 1px; }
        .disclaimer p { font-size: 12px; color: #ddd; line-height: 1.6; margin: 0; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .tool-grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h3 { color: var(--primary); margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid rgba(0, 242, 254, 0.1); padding-bottom: 10px; }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            margin-top: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }

        button.main-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            color: #000;
            transition: 0.3s;
        }
        button.main-btn:hover { opacity: 0.9; transform: scale(1.01); }

        .result-panel {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
            display: none;
            border-left: 4px solid var(--primary);
        }

        .view-toggle {
            background: transparent;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            padding: 6px 15px;
            font-size: 11px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .data-display { font-size: 13px; line-height: 1.8; color: #fff; }
        .json-display { font-family: 'Courier New', monospace; font-size: 12px; color: #88ccff; white-space: pre-wrap; display: none; }
    </style>
</head>
<body>

<div class="main-container">
    
    <div class="disclaimer">
        <h4>⚠️ महत्वपूर्ण चेतावनी / DISCLAIMER</h4>
        <p>
            🛡️ यह टूल केवल शिक्षा और जानकारी के उद्देश्य से बनाया गया है।<br>
            🚫 डेटा का गलत उपयोग कानूनी अपराध हो सकता है।<br>
            ⚖️ किसी भी अवैध गतिविधि के लिए यूजर स्वयं जिम्मेदार होगा।
        </p>
    </div>

    <div class="header">
        <h1>V-INTEL CORE</h1>
    </div>

    <div class="tool-grid">
        
        <div class="card">
            <h3>🏦 IFSC BANK INTELLIGENCE</h3>
            <input type="text" id="ifsc-input" placeholder="बैंक का IFSC कोड डालें (e.g. SBIN0001234)">
            <button class="main-btn" onclick="fetchData('ifsc')">Verify Bank Details</button>
            <div id="ifsc-res" class="result-panel">
                <button class="view-toggle" onclick="toggleView('ifsc')">SWITCH VIEW (JSON/EMOJI)</button>
                <div id="ifsc-emoji" class="data-display"></div>
                <div id="ifsc-json" class="json-display"></div>
            </div>
        </div>

        <div class="card">
            <h3>🐙 GITHUB PROFILE DATA</h3>
            <input type="text" id="git-input" placeholder="GitHub यूजरनेम डालें...">
            <button class="main-btn" onclick="fetchData('git')">Get Profile Info</button>
            <div id="git-res" class="result-panel">
                <button class="view-toggle" onclick="toggleView('git')">SWITCH VIEW (JSON/EMOJI)</button>
                <div id="git-emoji" class="data-display"></div>
                <div id="git-json" class="json-display"></div>
            </div>
        </div>

    </div>
</div>

<script>
    async function fetchData(type) {
        const val = document.getElementById(`${type}-input`).value;
        const panel = document.getElementById(`${type}-res`);
        const eBox = document.getElementById(`${type}-emoji`);
        const jBox = document.getElementById(`${type}-json`);

        if(!val) {
            alert("कृपया इनपुट बॉक्स में जानकारी भरें!");
            return;
        }

        panel.style.display = "block";
        eBox.innerHTML = "🌀 सुरक्षित डेटा खोजा जा रहा है...";

        let url = (type === 'git') 
            ? `https://api.github.com/users/${val}` 
            : `https://ifsc.razorpay.com/${val}`;

        try {
            const res = await fetch(url);
            if(!res.ok) throw new Error("डेटा नहीं मिला");
            const data = await res.json();

            // JSON Display
            jBox.textContent = JSON.stringify(data, null, 2);

            // Emoji Display
            let html = "";
            for (let [k, v] of Object.entries(data)) {
                if (typeof v !== 'object' && v !== null) {
                    html += `🔹 <b>${k.toUpperCase()}</b>: ${v}<br>`;
                }
            }
            eBox.innerHTML = html || "✅ सफलता! विवरण के लिए स्विच व्यू बटन दबाएं।";

        } catch (err) {
            eBox.innerHTML = "❌ <span style='color:#ff4f4f'>त्रुटि: डेटा प्राप्त करने में विफल। कृपया सही इनपुट दें।</span>";
        }
    }

    function toggleView(type) {
        const e = document.getElementById(`${type}-emoji`);
        const j = document.getElementById(`${type}-json`);
        if (e.style.display === "none") {
            e.style.display = "block";
            j.style.display = "none";
        } else {
            e.style.display = "none";
            j.style.display = "block";
        }
    }
</script>

</body>
</html>
